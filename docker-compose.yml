# docker compose up --build   ->   http://127.0.0.1:8000
services:
  audio-forensic:
    build: .
    image: audio-forensic
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env            # HF_ACCESS_TOKEN=hf_...
    volumes:
      - ./data:/app/data      # SQLite database, uploads, results
      - ./models:/app/models  # GGUF + large FP16/FP8 weights
      - ./vendor:/app/vendor  # audio.cpp runtime
      - hf-cache:/root/.cache/huggingface   # small model checkpoint, T5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  hf-cache:
